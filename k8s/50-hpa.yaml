apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: scenario
  namespace: ir-tabletop

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scenario

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

